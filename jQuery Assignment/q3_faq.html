<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Q3 - Interactive FAQ</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="q3_faq.js"></script>
</head>
<body>
  <main>
    <h2>FAQ</h2>
    <section id="faq">
      <div class="qa">
        <h3 class="q" tabindex="0">What is the return policy?</h3>
        <div class="a" style="display:none;">
          <p>Return within 30 days with receipt.</p>
          <input class="ans-input" placeholder="Type note"/>
        </div>
      </div>
      <div class="qa">
        <h3 class="q" tabindex="0">How long is shipping?</h3>
        <div class="a" style="display:none;">
          <p>Standard shipping: 5-7 days.</p>
          <input class="ans-input" placeholder="Type note"/>
        </div>
      </div>
      <div class="qa">
        <h3 class="q" tabindex="0">Do you ship internationally?</h3>
        <div class="a" style="display:none;">
          <p>Yes, to selected countries.</p>
          <input class="ans-input" placeholder="Type note"/>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
