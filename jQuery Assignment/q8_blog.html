<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Q8 - Dynamic Blog Posts</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="q8_blog.js"></script>
</head>
<body>
  <main>
    <h2>Blog Posts (Admin)</h2>
    <button id="add-post">Add New Post</button>
    <button id="prepend-featured">Prepend Featured Post</button>
    <button id="remove-last">Remove Last Post</button>
    <ul id="posts">
      <li class="post">Welcome to our blog</li>
      <li class="post">Release Notes</li>
      <li class="post">How to use the product</li>
    </ul>
  </main>
</body>
</html>
