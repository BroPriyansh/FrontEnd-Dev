<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Q10 - Registration Form Validation</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="q10_register.js"></script>
  <style>.invalid{border:2px solid red}</style>
</head>
<body>
  <main>
    <h2>Register</h2>
    <form id="reg-form">
      <label>Name: <input id="name" name="name"></label><br>
      <label>Email: <input id="email" name="email"></label><br>
      <label>Password: <input id="password" name="password" type="password"></label><br>
      <button type="submit">Submit</button>
    </form>
    <div id="result"></div>
  </main>
</body>
</html>
