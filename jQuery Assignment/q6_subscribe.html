<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Q6 - Event Subscription Panel</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="q6_subscribe.js"></script>
</head>
<body>
  <main>
    <h2>Subscriptions</h2>
    <ul id="topics">
      <li>News <button class="subscribe">Subscribe</button> <button class="unsubscribe">Unsubscribe</button></li>
      <li>Offers <button class="subscribe">Subscribe</button> <button class="unsubscribe">Unsubscribe</button></li>
      <li>Events <button class="subscribe">Subscribe</button> <button class="unsubscribe">Unsubscribe</button></li>
    </ul>

    <input id="new-topic" placeholder="New topic name"/>
    <button id="add-topic">Add Topic</button>

    <div id="messages"></div>
  </main>
</body>
</html>
